{% extends "emails/base_email.html" %}

{% block content %}
<h2 style="color:#2B2B2B; font-size:22px; margin:0 0 10px;">✅ Solicitud aprobada</h2>
<p style="font-size:16px; line-height:1.6;">Hola <strong>{{ empleado_nombre }}</strong>,</p>
<p style="font-size:16px; line-height:1.6;">Tu solicitud de <strong>{{ tipo_solicitud }}</strong> ha sido <span style="color:#28A745; font-weight:bold;">APROBADA</span>.</p>
<table style="width:100%; border-collapse:collapse; margin:20px 0; background-color:#F5F5F5; border-radius:8px;">
    <tr><td style="padding:10px 15px; font-weight:bold; color:#A40706; width:30%;">Fecha inicio:</td><td style="padding:10px 15px;">{{ fecha_inicio }}</td></tr>
    <tr><td style="padding:10px 15px; font-weight:bold; color:#A40706;">Fecha fin:</td><td style="padding:10px 15px;">{{ fecha_fin }}</td></tr>
</table>
<p style="color:#6B7280; font-size:14px; margin-top:20px;">Revisa el sistema para más información.</p>
{% endblock %}
