{% extends "emails/base_email.html" %}

{% block content %}
<h2 style="color:#2B2B2B; font-size:22px; margin:0 0 10px;">🚫 Memorando anulado</h2>
<p style="font-size:16px; line-height:1.6;">Hola <strong>{{ empleado_nombre }}</strong>,</p>
<p style="font-size:16px; line-height:1.6;">El memorando <strong>{{ consecutivo }}</strong> ({{ tipo }}) ha sido anulado.</p>
<p style="color:#6B7280; font-size:14px; margin-top:20px;">Si tienes dudas, contacta al administrador.</p>
{% endblock %}
