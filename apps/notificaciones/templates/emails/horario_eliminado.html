{% extends "emails/base_email.html" %}

{% block content %}
<h2 style="color:#2B2B2B; font-size:22px; margin:0 0 10px;">🚫 Horario eliminado</h2>
<p style="font-size:16px; line-height:1.6;">Hola <strong>{{ empleado_nombre }}</strong>,</p>
<p style="font-size:16px; line-height:1.6;">Tu horario de <strong>{{ turno }}</strong> ha sido desactivado.</p>
<p style="color:#6B7280; font-size:14px; margin-top:20px;">Contacta al administrador si tienes dudas.</p>
{% endblock %}
