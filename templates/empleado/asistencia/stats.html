<!-- Encabezado de la sección -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3><i class="bi bi-calendar-check me-2"></i>Asistencia de hoy</h3>
    <span class="text-muted small">{{ fecha_hoy|date:"l, d \d\e F \d\e Y" }}</span>
</div>

<!-- Rejilla con las 3 Tarjetas KPI -->
<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="stat-card">
            <div>
                <span class="text-muted">Días con asistencia</span>
                <h3 class="mt-1 mb-0">{{ dias_asistencia }}</h3>
            </div>
            <div class="icono-circular bg-success-subtle text-success">
                <i class="bi bi-check-circle-fill fs-4"></i>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="stat-card">
            <div>
                <span class="text-muted">Días sin asistencia</span>
                <h3 class="mt-1 mb-0">{{ dias_sin_asistencia }}</h3>
            </div>
            <div class="icono-circular bg-danger-subtle text-danger">
                <i class="bi bi-x-circle-fill fs-4"></i>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="stat-card">
            <div>
                <span class="text-muted">Retardos</span>
                <h3 class="mt-1 mb-0">{{ retardos }}</h3>
            </div>
            <div class="icono-circular bg-warning-subtle text-warning">
                <i class="bi bi-hourglass-split fs-4"></i>
            </div>
        </div>
    </div>
</div>
