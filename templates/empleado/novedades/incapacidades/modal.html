<!-- empleado/novedades/incapacidades/modal.html -->
<div id="formIncapacidad" class="dynamic-form" style="display: none;">
    <div class="modal-detalle-grid mt-3">
        
        <div class="modal-detalle-item">
            <span class="modal-detalle-label">Fecha de inicio <span class="text-danger">*</span></span>
            <span class="modal-detalle-value">
                <input type="date" class="form-control" id="incapacidadFechaInicio" name="incapacidad-fecha_inicio" value="{{ incapacidad_form.fecha_inicio.value|default:'' }}" required>
            </span>
        </div>

        <div class="modal-detalle-item">
            <span class="modal-detalle-label">Fecha de fin <span class="text-danger">*</span></span>
            <span class="modal-detalle-value">
                <input type="date" class="form-control" id="incapacidadFechaFin" name="incapacidad-fecha_fin" value="{{ incapacidad_form.fecha_fin.value|default:'' }}" required>
            </span>
        </div>

        <!-- Campo calculado automáticamente, no editable -->
        <div class="modal-detalle-item">
            <span class="modal-detalle-label">Total de días</span>
            <span class="modal-detalle-value">
                <input type="text" class="form-control bg-light" id="incapacidadDias" readonly placeholder="Se calcula automáticamente">
            </span>
        </div>

        <div class="modal-detalle-bloque-largo modal-detalle-bloque-largo--caja">
            <span class="modal-detalle-label">Adjuntar soporte médico <span class="text-danger">*</span></span>
            <input type="file" class="form-control" id="incapacidadAdjunto" name="incapacidad-archivo" accept=".pdf,.jpg,.png,.jpeg" required>
            <small class="file-info text-muted">Sube la foto o PDF de la incapacidad expedida por la EPS. (máx 5MB).</small>
        </div>

    </div>
</div>
