<!-- empleado/solicitudes/incapacidades/content.html -->
{% for i in incapacidades_historial %}
    <div class="request-card request-card-grid request-{{ i.estado|slugify }}"
        data-tipo="incapacidad"
        data-estado="{{ i.estado|slugify }}">

        <h6 class="card-grid-title">{{ i.titulo|default:"Incapacidad médica"|truncatechars:25 }}</h6>

        <div class="card-grid-meta">
            <span>
                <i class="bi bi-calendar3"></i>
                {{ i.fecha_inicio|date:"d/m/Y" }} → {{ i.fecha_fin|date:"d/m/Y" }}
            </span>
            <span>
                <i class="bi bi-clock"></i>
                {{ i.fecha_solicitud|date:"d/m/Y" }}
            </span>
        </div>

        <div class="card-grid-footer">
            <button type="button" class="card-grid-btn btn-ver-detalle"
                    data-titulo="{{ i.titulo|default:'Incapacidad médica' }}"
                    data-subtitulo="Incapacidad · {{ i.fecha_inicio|date:'d/m/Y' }} → {{ i.fecha_fin|date:'d/m/Y' }}"
                    data-motivo="{{ i.descripcion|escapejs }}"
                    data-estado="{{ i.get_estado_display|default:i.estado }}"
                    data-estado-slug="{{ i.estado|slugify }}"
                    data-motivo-rechazo="{{ i.motivo_rechazo|default:''|escapejs }}"
                    data-archivo="{% if i.archivo %}{{ i.archivo.url }}{% endif %}"
                    data-tipo="incapacidad">
                <i class="bi bi-eye"></i> Ver detalles
            </button>
        </div>
    </div>
{% endfor %}
