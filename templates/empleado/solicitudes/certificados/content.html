<!-- empleado/solicitudes/certificados/content.html -->
{% for c in certificados_historial %}
    <div class="request-card request-card-grid request-{{ c.estado|slugify }}"
        data-tipo="certificado"
        data-estado="{{ c.estado|slugify }}">

        <h6 class="card-grid-title">{{ c.get_tipo_display|default:"Certificado"|truncatechars:25 }}</h6>

        <div class="card-grid-meta">
            <span>
                <i class="bi bi-calendar3"></i>
                {{ c.fecha_solicitud|date:"d/m/Y" }}
            </span>
            {% if c.fecha_emision %}
                <span>
                    <i class="bi bi-check-circle"></i>
                    {{ c.fecha_emision|date:"d/m/Y" }}
                </span>
            {% endif %}
        </div>

        <div class="card-grid-footer">
            <button type="button" class="card-grid-btn btn-ver-detalle"
                    data-titulo="{{ c.get_tipo_display|default:'Certificado' }}"
                    data-subtitulo="Certificado · Solicitado el {{ c.fecha_solicitud|date:'d/m/Y' }}"
                    data-motivo="{{ c.proposito|default:'Solicitud de certificado'|escapejs }}"
                    data-estado="{{ c.get_estado_display|default:c.estado }}"
                    data-estado-slug="{{ c.estado|slugify }}"
                    data-motivo-rechazo="{{ c.motivo_rechazo|default:''|escapejs }}"
                    data-archivo="{% if c.estado == 'aprobado' %}{% url 'novedades:certificado_descargar' c.id %}{% endif %}"
                    data-tipo="certificado">
                <i class="bi bi-eye"></i> Ver detalles
            </button>
        </div>
    </div>
{% endfor %}
