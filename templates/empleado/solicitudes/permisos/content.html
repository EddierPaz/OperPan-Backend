<!-- empleado/solicitudes/permisos/content.html -->
{% for p in permisos_historial %}
    <div class="request-card request-card-grid request-{{ p.estado|slugify }}"
        data-tipo="permiso"
        data-estado="{{ p.estado|slugify }}">

        <h6 class="card-grid-title">{{ p.get_tipo_display }}</h6>

        <div class="card-grid-meta">
            <span>
                <i class="bi bi-calendar3"></i>
                {{ p.fecha_inicio|date:"d/m/Y" }} → {{ p.fecha_fin|date:"d/m/Y" }}
            </span>
            <span>
                <i class="bi bi-clock"></i>
                {{ p.fecha_solicitud|date:"d/m/Y" }}
            </span>
        </div>

        <div class="card-grid-footer">
            <button type="button" class="card-grid-btn btn-ver-detalle"
                    data-titulo="{{ p.get_tipo_display }}"
                    data-subtitulo="Permiso · {{ p.fecha_inicio|date:'d/m/Y' }} → {{ p.fecha_fin|date:'d/m/Y' }}"
                    data-motivo="{{ p.justificacion|escapejs }}"
                    data-estado="{{ p.get_estado_display|default:p.estado }}"
                    data-estado-slug="{{ p.estado|slugify }}"
                    data-motivo-rechazo="{{ p.motivo_rechazo|default:''|escapejs }}"
                    data-archivo="{% if p.archivo %}{{ p.archivo.url }}{% endif %}"
                    data-tipo="permiso">
                <i class="bi bi-eye"></i> Ver detalles
            </button>
        </div>
    </div>
{% endfor %}
