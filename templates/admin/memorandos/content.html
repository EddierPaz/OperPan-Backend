<!-- KPIs -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3><i class="bi bi-file-earmark-text me-2"></i>Memorandos emitidos</h3>
</div>

<div class="row g-3 mb-4">

    <div class="col-md-4 col-6">
        <div class="kpi-card">
            <div class="text-muted">Total emitidos</div>
            <h3 id="memorandosKpiTotal">0</h3>
        </div>
    </div>

    <div class="col-md-4 col-6">
        <div class="kpi-card">
            <div class="text-muted">Emitidos este mes</div>
            <h3 id="memorandosKpiMes">0</h3>
        </div>
    </div>

    <div class="col-md-4 col-6">
        <div class="kpi-card">
            <div class="text-muted">Emitidos hoy</div>
            <h3 id="memorandosKpiHoy">0</h3>
        </div>
    </div>

</div>
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">

    <h3 class="mb-0">
        <i class="bi bi-clock-history me-2"></i>
        Historial de memorandos
    </h3>

    <button class="btn btn-primary-corporate ms-auto" data-bs-toggle="modal" data-bs-target="#modalMemorando">
        <i class="bi bi-plus-circle me-2"></i>
        Generar memorando
    </button>

</div>



<div class="card-modern">

    <div class="p-3">

        <div class="table-responsive-stack">

            <table class="table table-custom">

                <thead>
                    <tr>
                        <th>Consecutivo</th>
                        <th>Empleado</th>
                        <th>Tipo</th>
                        <th>Asunto</th>
                        <th>Fecha emisión</th>
                        <th>Generado por</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="memorandosTablaBody"></tbody>

            </table>

            <div id="memorandosSinResultados" class="text-center text-muted py-4 d-none">

                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                No hay memorandos registrados.

            </div>

        </div>

    </div>

</div>

</div>
