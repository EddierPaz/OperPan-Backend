<!-- Modal Generar Memorando -->
<div class="modal fade" id="modalMemorando" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content modal-detalle">

            <div class="modal-header modal-detalle-header">
                <div>
                    <div class="modal-detalle-titulo">
                        <i class="bi bi-file-earmark-text"></i>
                        <span>Generar memorando</span>
                    </div>
                    <p class="modal-detalle-subtitulo mb-0">
                        Redacta y genera un memorando para un empleado
                    </p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body modal-detalle-body">
                <form id="memorandoForm">
                    {% csrf_token %}

                    <div class="modal-detalle-grid">
                        <!-- Empleado -->
                        <div class="modal-detalle-item">
                            <span class="modal-detalle-label">Empleado <span class="text-danger">*</span></span>
                            <span class="modal-detalle-value">
                                <select class="form-select" id="memorandoEmpleado" required>
                                    <option value="">Seleccionar empleado</option>
                                </select>
                            </span>
                        </div>

                        <!-- Cargo -->
                        <div class="modal-detalle-item">
                            <span class="modal-detalle-label">Cargo</span>
                            <span class="modal-detalle-value">
                                <input type="text" class="form-control" id="memorandoCargo" readonly 
                                       placeholder="Se autocompleta" style="background-color: #f8fafc;">
                            </span>
                        </div>

                        <!-- Tipo -->
                        <div class="modal-detalle-item">
                            <span class="modal-detalle-label">Tipo <span class="text-danger">*</span></span>
                            <span class="modal-detalle-value">
                                <select class="form-select" id="memorandoTipo" required>
                                    <option value="">Seleccionar tipo</option>
                                    <option value="llamado_atencion">Llamado de atención</option>
                                    <option value="amonestacion">Amonestación escrita</option>
                                    <option value="reconocimiento">Reconocimiento</option>
                                    <option value="informacion">Información general</option>
                                    <option value="advertencia">Advertencia</option>
                                    <option value="cambio_funciones">Cambio de funciones</option>
                                    <option value="otro">Otro</option>
                                </select>
                            </span>
                        </div>

                        <div class="modal-detalle-item" style="grid-column: span 2;">
                            <span class="modal-detalle-label">Asunto <span class="text-danger">*</span></span>
                            <span class="modal-detalle-value">
                                <input type="text" class="form-control" id="memorandoAsunto" 
                                       placeholder="Escriba el asunto del memorando" required>
                            </span>
                        </div>

                        <div class="modal-detalle-bloque-largo modal-detalle-bloque-largo--caja">
                            <span class="modal-detalle-bloque-largo-label">Contenido <span class="text-danger">*</span></span>
                            <textarea class="form-control" id="memorandoContenido" rows="8" 
                                      placeholder="Redacte el contenido completo del memorando..." required></textarea>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer modal-detalle-footer">
                <button type="reset" class="btn-action btn-action-cancel" form="memorandoForm">
                    <i class="bi bi-eraser"></i> Limpiar campos
                </button>
                <button type="submit" form="memorandoForm" class="btn-action btn-action-save" id="memorandoBtnGenerar">
                    <i class="bi bi-file-earmark-pdf me-2"></i> Generar memorando
                </button>
            </div>

        </div>
    </div>
</div>
