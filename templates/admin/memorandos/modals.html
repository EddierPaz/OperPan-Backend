<!-- Modal Generar Memorando -->
<div class="modal fade" id="modalMemorando" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="bi bi-file-earmark-text me-2"></i>
                    Generar memorando
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="memorandoForm">

                    {% csrf_token %}

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Empleado *
                            </label>

                            <select class="form-select"
                                    id="memorandoEmpleado"
                                    required>

                                <option value="">
                                    Seleccionar empleado
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Tipo de memorando *
                            </label>

                            <select class="form-select"
                                    id="memorandoTipo"
                                    required>

                                <option value="">
                                    Seleccionar tipo
                                </option>

                                <option value="llamado_atencion">
                                    Llamado de atención
                                </option>

                                <option value="amonestacion">
                                    Amonestación escrita
                                </option>

                                <option value="reconocimiento">
                                    Reconocimiento
                                </option>

                                <option value="informacion">
                                    Información general
                                </option>

                                <option value="advertencia">
                                    Advertencia
                                </option>

                                <option value="cambio_funciones">
                                    Cambio de funciones
                                </option>

                                <option value="otro">
                                    Otro
                                </option>

                            </select>

                        </div>

                        <div class="col-12">

                            <label class="form-label">
                                Asunto *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="memorandoAsunto"
                                placeholder="Escriba el asunto del memorando"
                                required>

                        </div>

                        <div class="col-12">

                            <label class="form-label">
                                Contenido *
                            </label>

                            <textarea
                                class="form-control"
                                id="memorandoContenido"
                                rows="8"
                                placeholder="Redacte el contenido completo del memorando..."
                                required></textarea>

                        </div>

                    </div>

                    <div id="memorandoMensaje" class="mt-3"></div>

                </form>

            </div>

            <div class="modal-footer">
                <button type="reset" class="btn btn-outline-corporate">Limpiar campos</button>

                <button type="submit"
                        form="memorandoForm"
                        class="btn btn-primary-corporate"
                        id="memorandoBtnGenerar">

                    <i class="bi bi-file-earmark-pdf me-2"></i>
                    Generar memorando

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Modal de confirmación (por si se requiere en el futuro) -->
<div class="modal fade" id="memorandoConfirmModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Confirmar
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body"
                 id="memorandoConfirmBody">
            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button type="button"
                        class="btn btn-primary"
                        id="memorandoConfirmAction">

                    Confirmar

                </button>

            </div>

        </div>

    </div>

</div>
