<!-- KPIs Mensuales -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3>
        <i class="bi bi-award-fill me-2"></i>
        Certificados este mes
    </h3>
</div>

<div class="row g-3 mb-4">
    <!-- Pendientes -->
    <div class="col-md-4 col-6">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted">Pendientes</span>
                <h3 class="mt-1" id="certificadosKpiPendientes">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-hourglass-split fs-2 text-warning"></i>
            </div>
        </div>
    </div>

    <!-- Aprobadas -->
    <div class="col-md-4 col-6">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted">Aprobadas</span>
                <h3 class="mt-1" id="certificadosKpiAprobadas">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-check-circle-fill fs-2 text-success"></i>
            </div>
        </div>
    </div>

    <!-- Rechazadas -->
    <div class="col-md-4 col-6">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted">Rechazadas</span>
                <h3 class="mt-1" id="certificadosKpiRechazadas">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-x-circle-fill fs-2 text-danger"></i>
            </div>
        </div>
    </div>
</div>

<!-- Bandeja de Solicitudes Pendientes -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3 class="mb-0">
        <i class="bi bi-inbox-fill me-2"></i>
        Bandeja de certificados pendientes
    </h3>
</div>

<div class="card-modern mb-4">
    <div class="p-3" id="certificadosSolicitudesContainer">
        <!-- Renderizado dinámico vía JS -->
    </div>
</div>

<!-- Historial de Certificados -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3 class="mb-0">
        <i class="bi bi-clock-history me-2"></i>
        Historial de certificados
    </h3>
</div>

<!-- Filtros del Historial -->
<div class="filtros-toolbar">
    <div class="filtro-buscar">
        <i class="bi bi-search"></i>
        <input type="text" id="buscarCertificado" placeholder="Buscar por documento, usuario o nombre...">
    </div>

    <select id="certificadosFiltroTipo" class="filtro-select">
        <option value="">Todos los tipos</option>
        <option value="laboral">Certificado laboral</option>
        <option value="ingresos">Certificado de ingresos</option>
        <option value="antiguedad">Certificado de antigüedad</option>
    </select>

    <select id="certificadosFiltroEstado" class="filtro-select">
        <option value="">Todos los estados</option>
        <option value="aprobado">Aprobado</option>
        <option value="pendiente">Pendiente</option>
        <option value="rechazado">Rechazado</option>
    </select>

    <button type="button" id="certificadosBtnLimpiar" class="filtro-btn-limpiar">
        Limpiar campos
    </button>
</div>

<!-- Tabla Historial de Certificados -->
<div class="card-modern mb-5">
    <div class="p-3 table-responsive-stack">
        <table class="table table-custom align-middle">
            <thead>
                <tr>
                    <th>EMPLEADO</th>
                    <th>CARGO</th>
                    <th>TIPO DE CERTIFICADO</th>
                    <th>FECHA DE EMISIÓN / SOLICITUD</th>
                    <th>ESTADO</th>
                    <th>ACCIONES</th> 
                </tr>
            </thead>
            <tbody id="certificadosTablaBody">
                <!-- Renderizado dinámico vía JS -->
            </tbody>
        </table>

        <div id="certificadosSinResultados" class="text-center text-muted py-4 d-none">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            No se encontraron certificados con los filtros seleccionados.
        </div>
    </div>
</div>
