<!-- =========================================================
     MODALES: CERTIFICADOS (ADMIN)
========================================================= -->

<!-- Modal Detalle Certificado -->
<div class="modal fade" id="certificadosDetalleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-detalle">

            <div class="modal-header modal-detalle-header">
                <div>
                    <div class="modal-detalle-titulo">
                        <i class="bi bi-award-fill"></i>
                        <span id="certificadoDetalleTitulo">Detalle de certificado</span>
                    </div>
                    <p class="modal-detalle-subtitulo mb-0" id="certificadoDetalleSubtitulo">
                        Información completa de la solicitud
                    </p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body modal-detalle-body" id="certificadosModalBody">
                <!-- Renderizado por JS -->
            </div>

            <!-- Footer: rojo=rechazar, verde=aprobar, teal=descargar
                 (acciones distintas, colores del sistema global). -->
            <div class="modal-footer modal-detalle-footer">
                <button type="button" class="btn-action btn-action-close" data-bs-dismiss="modal">
                    <i class="bi bi-x-lg"></i> Cerrar
                </button>
                <div class="d-flex gap-2" id="certificadosAccionesFooter">
                    <button type="button" class="btn-action btn-action-reject" id="certificadosRechazarBtn">
                        <i class="bi bi-x-circle"></i> Rechazar
                    </button>
                    <button type="button" class="btn-action btn-action-approve" id="certificadosAprobarBtn">
                        <i class="bi bi-check-circle"></i> Aprobar
                    </button>
                    <button type="button" class="btn-action btn-action-download" id="certificadosDescargarBtn" style="display:none;">
                        <i class="bi bi-download"></i> Descargar PDF
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Confirmar Aprobación Certificado -->
<div class="modal fade" id="certificadosConfirmApproveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content confirm-modal">
            <div class="modal-body confirm-modal-body">
                <div class="confirm-modal-icon confirm-modal-icon--success">
                    <i class="bi bi-check-lg"></i>
                </div>
                <h5 class="confirm-modal-title">¿Aprobar certificado?</h5>
                <p class="confirm-modal-text">El certificado será marcado como aprobado y se registrará la fecha de emisión.</p>
            </div>
            <div class="confirm-modal-footer">
                <button type="button" class="btn-action btn-action-cancel" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cancelar
                </button>
                <button type="button" class="btn-action btn-action-approve" id="certificadosConfirmApprove">
                    <i class="bi bi-check-circle"></i> Sí, aprobar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Motivo de Rechazo Certificado -->
<div class="modal fade" id="certificadosRejectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content confirm-modal">
            <div class="modal-body confirm-modal-body text-start">
                <div class="confirm-modal-icon confirm-modal-icon--danger mx-auto mb-3">
                    <i class="bi bi-x-lg"></i>
                </div>
                <h5 class="confirm-modal-title text-center">¿Rechazar certificado?</h5>
                <p class="confirm-modal-text text-center mb-3">Deberás indicar el motivo del rechazo.</p>
                <div class="mb-2">
                    <label for="certificadosRejectReason" class="form-label">
                        Motivo del rechazo <span class="text-danger">*</span>
                    </label>
                    <textarea id="certificadosRejectReason" class="form-control" rows="3" placeholder="Escribe el motivo del rechazo..."></textarea>
                    <small class="text-muted d-block mt-1">Este motivo será visible para el empleado.</small>
                </div>
            </div>
            <div class="confirm-modal-footer">
                <button type="button" class="btn-action btn-action-cancel" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cancelar
                </button>
                <button type="button" class="btn-action btn-action-reject" id="certificadosConfirmReject">
                    <i class="bi bi-x-circle"></i> Rechazar certificado
                </button>
            </div>
        </div>
    </div>
</div>
