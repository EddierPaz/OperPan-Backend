<!-- KPIs Mensuales -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3>
        <i class="bi bi-heart-pulse-fill me-2"></i>
        Incapacidades este mes
    </h3>
</div>

<div class="row g-3 mb-4">
    <!-- Pendientes -->
    <div class="col-md-4 col-6">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted">Pendientes</span>
                <h3 class="mt-1" id="incapacidadesKpiPendientes">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-hourglass-split fs-2 text-warning"></i>
            </div>
        </div>
    </div>

    <!-- Aprobadas -->
    <div class="col-md-4 col-6">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted">Aprobadas</span>
                <h3 class="mt-1" id="incapacidadesKpiAprobadas">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-check-circle-fill fs-2 text-success"></i>
            </div>
        </div>
    </div>

    <!-- Rechazadas -->
    <div class="col-md-4 col-6">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted">Rechazadas</span>
                <h3 class="mt-1" id="incapacidadesKpiRechazadas">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-x-circle-fill fs-2 text-danger"></i>
            </div>
        </div>
    </div>
</div>

<!-- Bandeja de Incapacidades Pendientes -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3 class="mb-0">
        <i class="bi bi-inbox-fill me-2"></i>
        Bandeja de incapacidades pendientes
    </h3>
</div>

<div class="card-modern mb-4">
    <div class="p-3" id="incapacidadesListaContainer">
        <!-- Renderizado dinámico vía JS -->
    </div>
</div>

<!-- Historial de Incapacidades -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3 class="mb-0">
        <i class="bi bi-clock-history me-2"></i>
        Historial de incapacidades
    </h3>
</div>

<!-- Filtros del Historial -->
<div class="filtros-toolbar">
    <div class="filtro-buscar">
        <i class="bi bi-search"></i>
        <input type="text" id="buscarIncapacidad" placeholder="Buscar por documento, usuario o nombre...">
    </div>

    <select id="incapacidadesFiltroEstado" class="filtro-select">
        <option value="">Todos los estados</option>
        <option value="aprobado">Aprobado</option>
        <option value="pendiente">Pendiente</option>
        <option value="rechazado">Rechazado</option>
    </select>

    <button type="button" id="incapacidadesBtnBuscar" class="filtro-btn-buscar">
        <i class="bi bi-search me-1"></i> Buscar
    </button>

    <button type="button" id="incapacidadesBtnLimpiar" class="filtro-btn-limpiar">
        Limpiar campos
    </button>
</div>

<!-- Tabla Historial -->
<div class="card-modern mb-5">
    <div class="p-3 table-responsive-stack">
        <table class="table table-custom align-middle">
            <thead>
                <tr>
                    <th>FECHA SOLICITUD</th>
                    <th>EMPLEADO</th>
                    <th>DIAGNÓSTICO</th>
                    <th>PERÍODO</th>
                    <th>ESTADO</th>
                    <th>APROBADO POR</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="incapacidadesHistorialBody">
                <!-- Renderizado dinámico vía JS -->
            </tbody>
        </table>

        <div id="incapacidadesSinResultados" class="text-center text-muted py-4 d-none">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            No se encontraron incapacidades con los filtros seleccionados.
        </div>
    </div>
</div>
