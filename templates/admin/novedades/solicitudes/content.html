<!-- KPIs Mensuales -->
<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3>
        <i class="bi bi-calendar2-check-fill me-2"></i>
        Solicitudes este mes
    </h3>
</div>

<div class="row g-3 mb-4">
    <!-- Pendientes -->
    <div class="col-md-4 col-6">
        <div
            class="stat-card d-flex justify-content-between align-items-center"
        >
            <div>
                <span class="text-muted">Pendientes</span>
                <h3 class="mt-1" id="solicitudesKpiPendientes">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-hourglass-split fs-2 text-warning"></i>
            </div>
        </div>
    </div>

    <!-- Aprobadas -->
    <div class="col-md-4 col-6">
        <div
            class="stat-card d-flex justify-content-between align-items-center"
        >
            <div>
                <span class="text-muted">Aprobadas</span>
                <h3 class="mt-1" id="solicitudesKpiAprobados">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-check-circle-fill fs-2 text-success"></i>
            </div>
        </div>
    </div>

    <!-- Rechazadas -->
    <div class="col-md-4 col-6">
        <div
            class="stat-card d-flex justify-content-between align-items-center"
        >
            <div>
                <span class="text-muted">Rechazadas</span>
                <h3 class="mt-1" id="solicitudesKpiRechazados">0</h3>
            </div>
            <div class="icono-circular">
                <i class="bi bi-x-circle-fill fs-2 text-danger"></i>
            </div>
        </div>
    </div>
</div>

<!-- Bandeja de solicitudes Pendientes -->
<div
    class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2"
>
    <h3 class="mb-0">
        <i class="bi bi-inbox-fill me-2"></i>
        Bandeja de solicitudes pendientes
    </h3>
</div>

<div class="p-3" id="solicitudesNovedadesContainer">
    <!-- Renderizado dinámico vía JS -->
</div>

<!-- Historial de solicitudes -->
<div
    class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2"
>
    <h3 class="mb-0">
        <i class="bi bi-clock-history me-2"></i>
        Historial completo de solicitudes
    </h3>
</div>

<!-- Filtros del Historial -->
<div class="filtros-toolbar">
    <div class="filtro-buscar">
        <i class="bi bi-search"></i>
        <input
            type="text"
            id="buscarSolicitudes"
            placeholder="Buscar por documento, usuario o nombre..."
        />
    </div>

    <select id="solicitudesFiltroEstado" class="filtro-select">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="aprobado">Aprobado</option>
        <option value="rechazado">Rechazado</option>
    </select>

    <button type="button" id="solicitudesBtnLimpiar" class="filtro-btn-limpiar">
        Limpiar
    </button>
</div>

<!-- Tabla Historial -->
<div class="card-modern">
    <div class="p-3 table-responsive-stack">
        <table class="table table-custom align-middle">
            <thead>
                <tr>
                    <th>FECHA SOLICITUD</th>
                    <th>EMPLEADO</th>
                    <th>TIPO</th>
                    <th>FECHAS</th>
                    <th>ESTADO</th>
                    <th>APROBADO POR</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="solicitudesHistorialBody">
                <!-- Renderizado dinámico vía JS -->
            </tbody>
        </table>

        <div
            id="solicitudesSinResultados"
            class="text-center text-muted py-4 d-none"
        >
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            No se encontraron solicitudes que coincidan con la búsqueda.
        </div>
    </div>
</div>
