<!-- =========================================================
     MODALES: PERMISOS (ADMIN)
========================================================= -->

<!-- Modal Detalle Permiso -->
<div class="modal fade" id="permisosDetalleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content novedad-modal">

            <div class="modal-header novedad-detalle-header">
                <div>
                    <div class="novedad-detalle-titulo">
                        <i class="bi bi-file-earmark-text-fill"></i>
                        <span id="permisoDetalleTitulo">Detalle de permiso</span>
                    </div>
                    <p class="novedad-detalle-subtitulo mb-0" id="permisoDetalleSubtitulo">
                        Información completa de la solicitud
                    </p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body novedad-detalle-body" id="permisosModalBody">
                <!-- Renderizado por JS -->
            </div>

            <div class="modal-footer novedad-detalle-footer">
                <button type="button" class="novedad-modal-btn btn-outline-corporate" data-bs-dismiss="modal">
                    <i class="bi bi-x-lg"></i> Cerrar
                </button>
                <div class="d-flex gap-2" id="permisosAccionesFooter">
                    <button type="button" class="novedad-modal-btn novedad-modal-btn-rechazar" id="permisosRechazarBtn">
                        <i class="bi bi-x-circle"></i> Rechazar
                    </button>
                    <button type="button" class="novedad-modal-btn novedad-modal-btn-aprobar" id="permisosAprobarBtn">
                        <i class="bi bi-check-circle"></i> Aprobar
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Confirmar Aprobación Permiso -->
<div class="modal fade" id="permisosConfirmApproveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content novedad-modal">
            <div class="modal-header border-0 pb-0">
                <div class="novedad-confirm-icon novedad-confirm-icon-success mx-auto">
                    <i class="bi bi-check-lg"></i>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body text-center">
                <h5>¿Aprobar permiso?</h5>
                <p class="text-muted mb-0">Esta acción marcará el permiso como aprobado.</p>
            </div>
            <div class="modal-footer border-0 justify-content-center">
                <button type="button" class="novedad-modal-btn btn-outline-corporate" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="novedad-modal-btn btn-primary-corporate" id="permisosConfirmApprove">
                    <i class="bi bi-check-circle me-1"></i> Sí, aprobar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Motivo de Rechazo Permiso -->
<div class="modal fade" id="permisosRejectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content novedad-modal">
            <div class="modal-body text-center pt-4">
                <div class="novedad-confirm-icon novedad-confirm-icon-danger mx-auto mb-3">
                    <i class="bi bi-x-lg"></i>
                </div>
                <h5 class="mb-2">¿Rechazar permiso?</h5>
                <p class="text-muted mb-3">Deberás indicar el motivo del rechazo.</p>
                <div class="text-start">
                    <label for="permisosRejectReason" class="novedad-rechazo-label">
                        Motivo del rechazo <span class="text-danger">*</span>
                    </label>
                    <textarea id="permisosRejectReason" class="novedad-rechazo-textarea" placeholder="Escribe el motivo del rechazo..."></textarea>
                    <small class="text-muted d-block mt-1">Este motivo será visible para el empleado.</small>
                </div>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="novedad-modal-btn novedad-modal-btn-cerrar" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="novedad-modal-btn novedad-modal-btn-rechazar" id="permisosConfirmReject">
                    <i class="bi bi-x-circle me-1"></i> Rechazar permiso
                </button>
            </div>
        </div>
    </div>
</div>
