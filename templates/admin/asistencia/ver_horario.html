<!-- MODAL: Ver detalle del horario -->
<div class="modal fade" id="modalVerHorario" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content asistencia-modal">

      <!-- HEADER: Con estilo corporativo -->
      <div class="modal-header asistencia-detalle-header">
        <div>
          <div class="asistencia-detalle-titulo">
            <i class="bi bi-eye me-2"></i> <span>Detalle del horario</span>
          </div>
          <p class="asistencia-detalle-subtitulo mb-0">Información detallada de la programación</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body asistencia-detalle-body">
        <div class="asistencia-detalle-grid">
          
          <!-- Empleado -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-empleado">Empleado</label>
            <span class="asistencia-detalle-value">
              <input id="ver-empleado" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Cargo -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-cargo">Cargo</label>
            <span class="asistencia-detalle-value">
              <input id="ver-cargo" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Jornada -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-turno">Jornada</label>
            <span class="asistencia-detalle-value">
              <input id="ver-turno" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Hora entrada -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-entrada">Hora entrada</label>
            <span class="asistencia-detalle-value">
              <input id="ver-entrada" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Hora salida -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-salida">Hora salida</label>
            <span class="asistencia-detalle-value">
              <input id="ver-salida" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Próximo descanso -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-descanso">Próximo descanso</label>
            <span class="asistencia-detalle-value">
              <input id="ver-descanso" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Estado -->
          <div class="asistencia-detalle-item">
            <label class="asistencia-detalle-label" for="ver-estado">Estado</label>
            <span class="asistencia-detalle-value">
              <input id="ver-estado" class="form-control" type="text" readonly>
            </span>
          </div>

          <!-- Horario vigente (Bloque largo) -->
          <div class="asistencia-detalle-bloque-largo">
            <label class="asistencia-detalle-bloque-largo-label" for="ver-ciclo">Horario vigente</label>
            <span class="asistencia-detalle-value">
              <input id="ver-ciclo" class="form-control" type="text" readonly>
            </span>
          </div>

        </div>
      </div>

      <!-- FOOTER: Botón corporativo -->
      <div class="modal-footer asistencia-detalle-footer">
        <button type="button" class="asistencia-modal-btn btn-outline-corporate" data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>

    </div>
  </div>
</div>
