<div class="modal fade" id="modalHistorialEmpleado" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
    <div class="modal-content modal-detalle">
      <div class="modal-detalle-header">
        <div>
          <div class="modal-detalle-titulo">
            <i class="bi bi-clock-history"></i>
            <span id="modalHistorialTitulo">Historial de Asistencia</span>
          </div>
          <p class="modal-detalle-subtitulo mb-0" id="modalHistorialSubTitulo">Registros de asistencia del empleado</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-detalle-body">
        <!-- Filtros internos (sin mes) -->
        <div class="filtros-toolbar mb-3" id="filtrosInternosModal">
          <select id="filtroTurnoInterno" class="filtro-select">
            <option value="">Todos los turnos</option>
            <option value="MANANA">Mañana</option>
            <option value="TARDE">Tarde</option>
            <option value="FIJO">Fijo</option>
          </select>
          <select id="filtroEstadoInterno" class="filtro-select">
            <option value="">Todos los estados</option>
            <option value="PRESENTE">Presente</option>
            <option value="TARDE">Tarde</option>
            <option value="AUSENTE">Ausente</option>
          </select>
          <button type="button" id="limpiarFiltrosInternos" class="filtro-btn-limpiar">
            Limpiar campos
          </button>
        </div>

        <hr>

        <!-- Contenedor de la tabla con scroll -->
        <div id="contenidoHistorialEmpleado" style="max-height: 550px; overflow-y: auto;">
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-detalle-footer">
        <button type="button" class="btn-action btn-action-cancel" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
