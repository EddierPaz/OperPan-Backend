{% load static %}
<div class="asistencia-card-empleado card border-0 shadow-sm rounded-4 p-3 w-100"
     data-resumen="{{ empleado.resumen_json }}">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="empleado-nombre fw-bold m-0 text-truncate" title="{{ empleado.nombre }}">
      {{ empleado.nombre }}
    </h5>
    <span class="badge badge-cargo ms-2">{{ empleado.cargo }}</span>
  </div>

  <!-- Gráfico de torta -->
  <div class="empleado-grafico" style="position: relative; height: 120px; width: 120px; margin: 0 auto;">
    <canvas id="grafico-{{ empleado.id }}" width="120" height="120"></canvas>
  </div>

  <!-- Botón Ver historial -->
  <div class="mt-3 text-center">
    <button class="btn-action btn-action-view btn-ver-historial" data-empleado-id="{{ empleado.id }}" data-bs-toggle="modal" data-bs-target="#modalHistorialEmpleado">
      <i class="bi bi-clock-history"></i> Ver historial
    </button>
  </div>
</div>
