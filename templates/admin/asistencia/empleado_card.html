{% load static %}
<div class="asistencia-card-empleado card border-0 shadow-sm rounded-4 p-3 w-100"
  data-resumen="{{ empleado.resumen_json }}">
  <div class="d-flex flex-wrap align-items-center gap-1 mb-2">
    <h5 class="empleado-nombre fw-bold m-0 text-wrap" style="word-break: break-word;">
      {{ empleado.nombre }}
    </h5>
    <span class="badge badge-cargo">{{ empleado.cargo }}</span>
  </div>

  <!-- Gráfico de barras horizontales -->
  <div class="empleado-grafico" style="position: relative; height: 140px; width: 100%;">
    <canvas id="grafico-{{ empleado.id }}" width="100%" height="140"></canvas>
  </div>

  <!-- Botón Ver historial -->
  <div class="mt-3 text-center">
    <button class="btn-action btn-action-view btn-ver-historial" data-empleado-id="{{ empleado.id }}"
      data-bs-toggle="modal" data-bs-target="#modalHistorialEmpleado">
      <i class="bi bi-clock-history"></i> Ver historial
    </button>
  </div>
</div>
